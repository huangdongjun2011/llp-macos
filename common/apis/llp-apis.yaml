        "description": "With media metadata, saves the transcript for the token owner and selected source, creating a dictation with empty listening content and zero position if needed. Existing content, position, and media type are preserved. Without metadata, updates existing rows across sources and returns 404 if absent. Empty strings clear the transcript; repeated identical saves succeed.",
