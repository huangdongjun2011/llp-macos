            "type": "string",
            "description": "HS256 JWT for llp-api, valid for one hour."
          },
          "refresh_token": {
            "type": "string",
            "description": "Opaque bearer credential, valid for 15 days."
          },
          "token_type": {
            "type": "string",
            "enum": [
