{
  "openapi": "3.0.3",
  "info": {
    "title": "LLP API",
    "version": "1.0.0",
    "description": "Registration, email verification, login, logout, and refresh API. Login and refresh return tokens; other handler responses contain a message. Router errors are plain text. Authenticated dictation persistence for local and official media."
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "Local development; configure the client base URL for deployment."
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Registration"
    },
    {
      "name": "Authentication"
    },
    {
      "name": "Dictations"
    }
  ],
  "paths": {
    "/auth/register": {
      "post": {
        "tags": [
          "Registration"
        ],
        "operationId": "register",
        "summary": "Register a pending account",
        "description": "Normalizes email, hashes the password with bcrypt, and saves a PENDING account. SMTP acceptance does not guarantee inbox delivery. A 503 means the account was saved: use resend-verification instead of registering again. Existing emails, including pending accounts and concurrent insert conflicts, return 409.",
        "requestBody": {
          "required": true,
          "description": "One JSON object, at most 4096 bytes including whitespace. Unknown fields, malformed JSON, and trailing JSON values return 400. Content-Type application/json accepts media type parameters.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RegisterRequest"
              },
              "example": {
                "email": "user@example.com",
                "password": "a-long-password",
                "username": "alice"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Account saved; verification email accepted by SMTP.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "registration pending; check your email"
                }
              }
            }
          },
          "400": {
            "description": "Malformed JSON, oversized body, unknown fields, or invalid field values.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "invalid JSON body"
                }
              }
            }
          },
          "409": {
            "description": "Email already registered.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "email already registered"
                }
              }
            }
          },
          "415": {
            "description": "Missing, malformed, or unsupported Content-Type.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "Content-Type must be application/json"
                }
              }
            }
          },
          "500": {
            "description": "Database or internal failure.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "registration unavailable"
                }
              }
            }
          },
          "503": {
            "description": "Account saved, but verification email delivery failed.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "account pending; email delivery failed, use /auth/resend-verification"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/verify": {
      "get": {
        "tags": [
          "Registration"
        ],
        "operationId": "verifyEmail",
        "summary": "Verify a pending account email",
        "description": "Consumes an HMAC-SHA256 signed email verification token. Server-issued links expire after 24 hours. Atomically changes PENDING to ACTIVE and sets email_verified_at. Used links cannot activate active or disabled accounts. Tokens are bearer credentials; automated mail link scanners can consume them.",
        "parameters": [
          {
            "name": "token",
            "in": "query",
            "required": true,
            "description": "Token from the verification email; URL-encode when constructing the link. Missing or empty tokens return 400.",
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Email verified.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-referrer"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "email verified"
                }
              }
            }
          },
          "400": {
            "description": "Missing, invalid, expired, tampered, or used token, or unavailable account.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-referrer"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "invalid or expired verification link"
                }
              }
            }
          },
          "500": {
            "description": "Database failure.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-referrer"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "verification unavailable"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/resend-verification": {
      "post": {
        "tags": [
          "Registration"
        ],
        "operationId": "resendVerification",
        "summary": "Resend a verification email",
        "description": "Sends a new link only for PENDING accounts. Unknown and non-pending accounts receive the same 202 response without mail. Earlier links remain valid until expiry or successful verification.",
        "requestBody": {
          "required": true,
          "description": "One JSON object, at most 4096 bytes including whitespace. Unknown fields, malformed JSON, and trailing JSON values return 400. Content-Type application/json accepts media type parameters.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ResendVerificationRequest"
              },
              "example": {
                "email": "user@example.com"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Request accepted, regardless of whether a pending account exists.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "if the account is pending, a verification email has been sent"
                }
              }
            }
          },
          "400": {
            "description": "Malformed JSON, oversized body, unknown fields, or invalid field values.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "invalid JSON body"
                }
              }
            }
          },
          "415": {
            "description": "Missing, malformed, or unsupported Content-Type.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "Content-Type must be application/json"
                }
              }
            }
          },
          "500": {
            "description": "Database failure.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "verification unavailable"
                }
              }
            }
          },
          "503": {
            "description": "SMTP delivery failed.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "email delivery unavailable"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/login": {
      "post": {
        "tags": [
          "Authentication"
        ],
        "operationId": "login",
        "summary": "Log in an active account",
        "description": "Normalizes email and verifies bcrypt password and ACTIVE status. Atomically upserts the device and saves a SHA-256 refresh-token digest before returning tokens. Each successful login creates a fresh refresh token, including repeated device logins. Repeated login revokes the previous active refresh token for this user and device.",
        "requestBody": {
          "required": true,
          "description": "One JSON object, at most 4096 bytes including whitespace. Unknown fields, malformed JSON, and trailing JSON values return 400. Content-Type application/json accepts media type parameters.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              },
              "example": {
                "email": "user@example.com",
                "password": "a-long-password",
                "device_id": "phone-1",
                "platform": "ios"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Authenticated; device and refresh token committed.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                },
                "example": {
                  "access_token": "signed.jwt.token",
                  "refresh_token": "opaque-random-token",
                  "token_type": "Bearer",
                  "expires_in": 3600,
                  "refresh_expires_in": 1296000
                }
              }
            }
          },
          "400": {
            "description": "Invalid JSON, fields, or oversized request.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "invalid JSON body"
                }
              }
            }
          },
          "401": {
            "description": "Unknown account, wrong password, or non-ACTIVE account.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "invalid email or password"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "Content-Type must be application/json"
                }
              }
            }
          },
          "500": {
            "description": "Database or token issuance failure; no tokens returned.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "login unavailable"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/refresh": {
      "post": {
        "tags": [
          "Authentication"
        ],
        "operationId": "refreshAccessToken",
        "summary": "Issue an access token using a refresh token",
        "description": "Requires an unexpired stored refresh token, an ACTIVE account, and an existing device. No access token is required. Refresh tokens remain reusable until their original expiry and are not rotated or extended. Revoked refresh tokens are rejected.",
        "requestBody": {
          "required": true,
          "description": "One JSON object, at most 4096 bytes including whitespace. Unknown fields, malformed JSON, and trailing JSON values return 400. Content-Type application/json accepts media type parameters.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RefreshRequest"
              },
              "example": {
                "refresh_token": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "New access token issued; refresh token remains unchanged.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RefreshResponse"
                },
                "example": {
                  "access_token": "signed.jwt.token",
                  "token_type": "Bearer",
                  "expires_in": 3600
                }
              }
            }
          },
          "400": {
            "description": "Invalid JSON, fields, or oversized request.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "invalid JSON body"
                }
              }
            }
          },
          "401": {
            "description": "Invalid, unknown, or expired refresh token, unavailable account, or missing device.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "invalid or expired refresh token"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "Content-Type must be application/json"
                }
              }
            }
          },
          "500": {
            "description": "Database or token issuance failure; no tokens returned.",
            "headers": {
              "Cache-Control": {
                "description": "Responses must not be cached.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Message"
                },
                "example": {
                  "message": "refresh unavailable"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/logout": {
      "post": {
        "tags": [
          "Authentication"
        ],
        "operationId": "logout",
        "summary": "Revoke the active refresh token for a device",
        "description": "Uses the verified access token subject as user ID and the body device_id as target. Returns 200 even if no active session exists. Existing access tokens remain valid until expiry.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "device_id"
                ],
                "properties": {
                  "device_id": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 36,
                    "pattern": "^[A-Za-z0-9._:-]{1,36}$"
                  }
                }
              },
              "example": {
                "device_id": "phone-1"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "logged out",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string"
                    }
                  }
                },
                "example": {
                  "message": "logged out"
                }
              }
            }
          },
          "400": {
            "description": "device_id of 1\u201336 ASCII letters, digits, dots, underscores, colons or hyphens required",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string"
                    }
                  }
                },
                "example": {
                  "message": "device_id of 1\u201336 ASCII letters, digits, dots, underscores, colons or hyphens required"
                }
              }
            }
          },
          "415": {
            "description": "Content-Type must be application/json",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string"
                    }
                  }
                },
                "example": {
                  "message": "Content-Type must be application/json"
                }
              }
            }
          },
          "500": {
            "description": "logout unavailable",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string"
                    }
                  }
                },
                "example": {
                  "message": "logout unavailable"
                }
              }
            }
          },
          "401": {
            "description": "Missing, invalid, or expired Bearer access token; middleware returns code, message, and refresh_allowed."
          }
        }
      }
    },
