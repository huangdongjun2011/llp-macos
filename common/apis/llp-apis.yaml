            "description": "Media category (audio or video). Omitted or null values default to an empty string."
          },
          "content": {
            "type": "string",
            "description": "Empty string clears saved text."
          },
          "position_ms": {
            "type": "integer",
            "minimum": 0,
            "default": 0,
