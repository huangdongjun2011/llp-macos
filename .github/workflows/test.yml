name: Test LLP macOS app

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full source commit SHA (defaults to the selected workflow ref)"
        required: false
        type: string
      version:
        description: "Application/API version (defaults to mac/api-version)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Run macOS unit tests
    runs-on: macos-15
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .workflow-scripts
          persist-credentials: false
      - name: Resolve source commit
        id: source
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: bash .workflow-scripts/.github/scripts/test/resolve-source-commit.sh
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout and record version
        id: metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .workflow-scripts/.github/scripts/test/verify-checkout-and-record-version.sh
      - name: Discover test configuration and run tests
        id: tests
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: bash .workflow-scripts/.github/scripts/test/discover-test-configuration-and-run-tests.sh
      - name: Write test metadata
        if: always() && steps.metadata.outcome == 'success'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: bash .workflow-scripts/.github/scripts/test/write-test-metadata.sh
      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llp-test-results-${{ github.run_id }}
          path: ${{ runner.temp }}/llp-test-results/
          if-no-files-found: warn
          retention-days: 30
