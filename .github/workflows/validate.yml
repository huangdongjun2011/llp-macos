name: Validate release inputs and Xcode project

on:
  workflow_dispatch:
    inputs:
      context:
        description: "JSON context for this release task"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate source, version, and Xcode project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .workflow-scripts
          persist-credentials: false

      - name: Parse workflow context
        id: context
        shell: bash
        env:
          CONTEXT: ${{ inputs.context }}
        run: bash .workflow-scripts/.github/scripts/common/parse-context.sh optional:commit_sha optional:version optional:build_number
      - name: Resolve and validate source commit
        id: source
        shell: bash
        env:
          INPUT_SHA: ${{ steps.context.outputs.commit_sha }}
          INPUT_VERSION: ${{ steps.context.outputs.version }}
          INPUT_BUILD_NUMBER: ${{ steps.context.outputs.build_number }}
          DISPATCH_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: bash .workflow-scripts/.github/scripts/validate/resolve-and-validate-source-commit.sh
      - name: Validate Xcode project structure and release scheme
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: bash .workflow-scripts/.github/scripts/validate/validate-xcode-project-structure-and-release-scheme.sh
