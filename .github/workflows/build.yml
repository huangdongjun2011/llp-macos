name: Build LLP macOS app

on:
  workflow_dispatch:
    inputs:
      context:
        description: "JSON context for this release task"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Release artifact
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    steps:
    - name: Checkout requested commit
      uses: actions/checkout@v4
      with:
        ref: ${{ fromJSON(inputs.context).commit_sha || github.sha }}
        persist-credentials: false

    - name: Parse workflow context
      id: context
      shell: bash

      env:
        CONTEXT: ${{ inputs.context }}
      run: |
        bash .github/scripts/common/parse-context.sh \
          optional:commit_sha optional:version

    - name: Resolve source commit
      id: source
      shell: bash
      env:
        INPUT_SHA: ${{ steps.context.outputs.commit_sha }}
      run: bash .github/scripts/build/resolve-source-commit.sh
      
    - name: Resolve version and build number
      id: metadata
      shell: bash
      env:
        INPUT_VERSION: ${{ steps.context.outputs.version }}
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
      run: bash .github/scripts/build/resolve-version-and-build-number.sh

    - name: Build Release configuration
      shell: bash
      env:
        VERSION: ${{ steps.metadata.outputs.version }}
        BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
      run: bash .github/scripts/build/build-release-configuration.sh

    - name: Save build metadata
      shell: bash
      env:
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
        VERSION: ${{ steps.metadata.outputs.version }}
        BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
      run: bash .github/scripts/build/save-build-metadata.sh

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.artifact_name }}
        path: artifact/
        if-no-files-found: error
        retention-days: 30